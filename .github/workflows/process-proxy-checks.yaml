name: Process proxy validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Offline source contracts
        run: python3 tool/check_process_proxy_sources.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Skip native assets for source-only generation and focused tests
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('pubspec.yaml')
          p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))
          PYCODE
      - name: Generate localization from source ARBs
        run: dart run intl_utils:generate
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Focused tests
        run: flutter test test/services/process_proxy*_test.dart test/views/process_proxy*_test.dart test/l10n test/lint/dynamic_message_key_test.dart
      - name: Preserve generated localization for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-localization
          path: lib/l10n
          if-no-files-found: error

  windows-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch exact audited ProxyLane source for bridge interfaces
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/threatexpert/ProxyLane.git "$env:RUNNER_TEMP/ProxyLane"
          git -C "$env:RUNNER_TEMP/ProxyLane" checkout --detach c95248ac8cc790efe0ebaa37383b1008e42c78ce
          $actual = git -C "$env:RUNNER_TEMP/ProxyLane" rev-parse HEAD
          if ($actual -ne 'c95248ac8cc790efe0ebaa37383b1008e42c78ce') { throw 'Unexpected source revision' }
      - name: Configure Windows bridge
        shell: pwsh
        run: cmake -S windows/proxylane_bridge -B build/proxylane_bridge -A x64 "-DPROXYLANE_SOURCE_DIR=$env:RUNNER_TEMP/ProxyLane"
      - name: Compile bridge only; never execute injection or certificate operations
        run: cmake --build build/proxylane_bridge --config Release
      - name: Run pure protocol policy tests only
        run: ctest --test-dir build/proxylane_bridge -C Release --output-on-failure
